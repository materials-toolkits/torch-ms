site_name: TorchMS
site_description: Datasets, graphs and energy estimation for crystal generation
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_options:
              # a "Returns:" section describes one value, on several lines
              returns_multiple_items: false
              returns_named_value: false
            docstring_section_style: list
            show_source: false
            show_root_heading: false
            show_root_toc_entry: false
            heading_level: 3
            members_order: source
            separate_signature: true
            show_signature_annotations: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            show_bases: false
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - User guide:
      - Installation: guide/installation.md
      - Loading datasets: guide/datasets.md
      - Structures: guide/structures.md
      - Data augmentation: guide/augmentation.md
      - Graphs: guide/graphs.md
      - Models: guide/models.md
      - Energy above the hull: guide/energy.md
      - Preprocessing your own data: guide/preprocessing.md
  - Datasets:
      - Overview: datasets/index.md
      - Perov-5: datasets/perov-5.md
      - Carbon-24: datasets/carbon-24.md
      - MP-20: datasets/mp-20.md
      - Materials Project: datasets/materials-project.md
      - OQMD: datasets/oqmd.md
      - LeMat-Bulk: datasets/lematerial.md
  - Design notes:
      - Batching convention: design/batching.md
      - Graph conventions: design/graphs.md
      - Convex hull: design/hull.md
      - Energy estimator: design/estimator.md
      - Loader and graph construction: design/loader.md
  - API reference:
      - torchms.data: reference/data.md
      - torchms.graph: reference/graph.md
      - torchms.models: reference/models.md
      - torchms.estimator: reference/estimator.md
