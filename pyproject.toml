[project]
name = "torchms"
version = "0.1.0"
description = "Torch Material Science: a Python library for machine learning on crystal structures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.16.0",
    "jaxtyping>=0.3.7",
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
hub = [
    "huggingface-hub>=0.30.0",
]

[dependency-groups]
dev = [
    "ase>=3.28.0",
    "black>=26.3.1",
    "huggingface-hub>=2.1.1",
    "poethepoet>=0.34.0",
    "pyarrow>=25.0.1",
    "pylint>=4.0.5",
    "pymatgen>=2025.10.7",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-timeout>=2.4.0",
    "rdkit>=2026.3.6",
    "spglib>=2.7.0",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[project.scripts]
preprocessing = "torchms.data.preprocessing:main"

[tool.poe.tasks]
sync.sequence = [
    {cmd = "uv sync"},
    {cmd = "uv run pyright --createstub torch"},
]
build = "uv build"
docs = "uv run --group docs mkdocs serve"
docs-build = "uv run --group docs mkdocs build --strict"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "src",
]
addopts = "--doctest-modules"
timeout = 3

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.black]
target-version = ["py310"]

[tool.pylint.master]
source = ["src/torchms"]
recursive = true
ignore = [".venv","tests"]


[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 10
max-locals = 20
max-attributes = 12



[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
torchms = ["**/*.json", "**/*.h5", "**/*.npz", "**/LICENSE"]
