# orb-v3 conservative of orb-models: weights, graph and hyperparameters, read by
# model.py.

default_weights: orb-v3-conservative-inf-mpa

# files of the pretrained weights, by name: where a file is downloaded, its
# expected SHA-256 and its name in the cache, the last part of the URL by default
checkpoints:
  orb-v3-conservative-inf-omat:
    - url: https://orbitalmaterials-public-models.s3.us-west-1.amazonaws.com/forcefields/orb-v3/orb-v3-conservative-inf-omat-20250404.ckpt
      sha256: 0a41ef1132ad9c41ee0c7b9d855fccabfefb97abe04625c97ec0d07930b6c0f0
  orb-v3-conservative-inf-mpa:
    - url: https://orbitalmaterials-public-models.s3.us-west-1.amazonaws.com/forcefields/orb-v3/orb-v3-conservative-inf-mpa-20250404.ckpt
      sha256: bd1840d1488f3cd01d213970d9618a63f971590ad45e5e83bf5404d4b95d216a

# parameters of the pretrained weights which are not used to predict the energy
unused_parameters:
  - model._decoder.
  - heads.confidence.
  - grad_forces_normalizer.
  - grad_stress_normalizer.

# an atom is connected to its nearest neighbours closer than the radius
graph:
  radius: 6.0             # Å
  max_neighbors: 120

model:
  latent_dim: 256         # features of the atoms and of the edges
  hidden_dim: 1024        # hidden layers of the networks of the layers
  num_elements: 118
  num_radial: 8           # functions of the radial basis
  num_layers: 5           # message passing layers
  cutoff_power: 4         # power of the smooth cutoff of the edges

# Ziegler-Biersack-Littmark repulsion between close atoms
repulsion:
  coefficients: [0.1818, 0.5099, 0.2802, 0.02817]
  exponents: [3.2, 0.9423, 0.4028, 0.2016]
  screening_length: 0.4543   # of two atoms, in Bohr radii, over the sum of z^power
  screening_power: 0.3
  bohr_radius: 0.529         # Å
  coulomb_constant: 14.3996  # eV Å
  cutoff_power: 6            # power of the smooth cutoff at the covalent radii
  # Covalent radii in Å indexed by atomic number (Cordero et al., Dalton Trans.
  # 2008, as distributed by ASE). Index 0 and elements above Cm are placeholders.
  covalent_radii: [
    0.20, 0.31, 0.28, 1.28, 0.96, 0.84, 0.76, 0.71, 0.66, 0.57, 0.58, 1.66,
    1.41, 1.21, 1.11, 1.07, 1.05, 1.02, 1.06, 2.03, 1.76, 1.70, 1.60, 1.53,
    1.39, 1.39, 1.32, 1.26, 1.24, 1.32, 1.22, 1.22, 1.20, 1.19, 1.20, 1.20,
    1.16, 2.20, 1.95, 1.90, 1.75, 1.64, 1.54, 1.47, 1.46, 1.42, 1.39, 1.45,
    1.44, 1.42, 1.39, 1.39, 1.38, 1.39, 1.40, 2.44, 2.15, 2.07, 2.04, 2.03,
    2.01, 1.99, 1.98, 1.98, 1.96, 1.94, 1.92, 1.92, 1.89, 1.90, 1.87, 1.87,
    1.75, 1.70, 1.62, 1.51, 1.44, 1.41, 1.36, 1.36, 1.32, 1.45, 1.46, 1.48,
    1.40, 1.50, 1.50, 2.60, 2.21, 2.15, 2.06, 2.00, 1.96, 1.90, 1.87, 1.80,
    1.69, 2.00, 2.00, 2.00, 2.00, 2.00, 2.00, 2.00, 2.00, 2.00, 2.00, 2.00,
    2.00, 2.00, 2.00, 2.00, 2.00, 2.00, 2.00, 2.00, 2.00, 2.00, 2.00
  ]
