# MatterGen: weights, graph and hyperparameters, read by model.py. The base
# model, which generates crystals without condition (MatterGen), and the models
# fine-tuned on properties: a chemical system (MatterGenChemicalSystem), a space
# group (MatterGenSpaceGroup), a band gap (MatterGenBandGap), a magnetic density
# (MatterGenMagneticDensity), a chemical system and the energy above the hull
# (MatterGenChemicalSystemEnergyAboveHull), a bulk modulus
# (MatterGenBulkModulus), a magnetic density and the HHI score
# (MatterGenMagneticDensityHHIScore), whose own values are in the sections
# named after their properties.

default_weights: mattergen-base

# The base model of MatterGen, trained on Alex-MP-20 by its authors and
# published on Hugging Face ("mattergen_base" in their checkpoints): the
# checkpoint of pytorch-lightning and the configuration of its training.
# files of the pretrained weights, by name: where a file is downloaded, its
# expected SHA-256 and its name in the cache, the last part of the URL by default
checkpoints:
  mattergen-base:
    - url: https://huggingface.co/microsoft/mattergen/resolve/5244495dd9a979ff71abc7548a0b14b9deb0069a/checkpoints/mattergen_base/checkpoints/last.ckpt
      sha256: 81668ee12afc1ee1b037f362420730de3460bfd2d36e547585fdcb911a3dfdef
    - url: https://huggingface.co/microsoft/mattergen/resolve/5244495dd9a979ff71abc7548a0b14b9deb0069a/checkpoints/mattergen_base/config.yaml
      sha256: 01648f40a8227b01b1dbc1090bf0f8229bb3241845ae9ac57af96b31e595bda7
  # the base model fine-tuned on Alex-MP-20 with its chemical systems, all its
  # weights ("chemical_system" in their checkpoints)
  mattergen-chemical-system:
    - url: https://huggingface.co/microsoft/mattergen/resolve/5244495dd9a979ff71abc7548a0b14b9deb0069a/checkpoints/chemical_system/checkpoints/last.ckpt
      sha256: 4ad21d977c2b776a31c92498c4d1c88d3e1e286deeb941e997af8e082310b80e
    - url: https://huggingface.co/microsoft/mattergen/resolve/5244495dd9a979ff71abc7548a0b14b9deb0069a/checkpoints/chemical_system/config.yaml
      sha256: 0640de891dc75e34c92c4da022344767918fe4a2300908b1013fe6161f3c2c81
  # the same for the space groups ("space_group" in their checkpoints)
  mattergen-space-group:
    - url: https://huggingface.co/microsoft/mattergen/resolve/5244495dd9a979ff71abc7548a0b14b9deb0069a/checkpoints/space_group/checkpoints/last.ckpt
      sha256: 1b6ab06739f4319d75f4a19960840ec3c8d3d32ee842c996876ef9d8b188e4bb
    - url: https://huggingface.co/microsoft/mattergen/resolve/5244495dd9a979ff71abc7548a0b14b9deb0069a/checkpoints/space_group/config.yaml
      sha256: 75ebcb5bcf3fc2f1c78aeb9a99c88bd99ebd61fcdaa5fe9463344a7c29df62ac
  # the same for the band gaps from DFT ("dft_band_gap" in their checkpoints)
  mattergen-dft-band-gap:
    - url: https://huggingface.co/microsoft/mattergen/resolve/5244495dd9a979ff71abc7548a0b14b9deb0069a/checkpoints/dft_band_gap/checkpoints/last.ckpt
      sha256: 864ebbfd360e0a8287287d290a552da6b6bd92d67418a6a40be419ed3acd5e7e
    - url: https://huggingface.co/microsoft/mattergen/resolve/5244495dd9a979ff71abc7548a0b14b9deb0069a/checkpoints/dft_band_gap/config.yaml
      sha256: 0e14dfe5ce3906fb5c6d80f9ef000278a9c679f639f7712e7690f7c4a9431e6e
  # the same for the magnetic densities from DFT ("dft_mag_density" in their checkpoints)
  mattergen-dft-mag-density:
