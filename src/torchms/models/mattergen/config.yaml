      sha256: 6129b1a2329c8031ae162687ab02c3652faf8ef3e59ae9b74163b9f829233155
  # the same for a chemical system and the energy above the hull together
  # ("chemical_system_energy_above_hull" in their checkpoints)
  mattergen-chemical-system-energy-above-hull:
    - url: https://huggingface.co/microsoft/mattergen/resolve/5244495dd9a979ff71abc7548a0b14b9deb0069a/checkpoints/chemical_system_energy_above_hull/checkpoints/last.ckpt
      sha256: 50d4a51b109b178db98de82849d0ad14397b663526b2387caee3a643f27e326a
    - url: https://huggingface.co/microsoft/mattergen/resolve/5244495dd9a979ff71abc7548a0b14b9deb0069a/checkpoints/chemical_system_energy_above_hull/config.yaml
