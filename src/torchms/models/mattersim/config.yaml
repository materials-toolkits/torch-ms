# MatterSim: weights, graph and hyperparameters, read by model.py. The M3GNet
# potential of MatterSim, a rewrite of M3GNet by Microsoft Research AI for
# Science, trained on structures of 0 to 5000 K and up to 1000 GPa.

default_weights: mattersim-v1.0.0-1m

# The smaller of the two models of the authors ("mattersim-v1.0.0-1M", 880K
# parameters, trained on 3M structures), the one MatterSim loads by default,
# in their repository at the tag v1.2.5. It holds a state dict, the arguments
# of the model and the state of the training, all tensors.
checkpoints:
  mattersim-v1.0.0-1m:
    - url: https://raw.githubusercontent.com/microsoft/mattersim/40a1eb8f1189a53af310957b4f2c5dfbfe68d647/pretrained_models/mattersim-v1.0.0-1M.pth
      sha256: 28b0b0b0f13efefee06b47ea4c9105a26bd3e2c8396da193430da96b3b49a8be

# atoms closer than the radius are bonded, the periodic images of an atom
# included; angles are between two bonds of at most the three-body radius
graph:
  radius: &radius 5.0                         # Å
  three_body_radius: &three_body_radius 4.0   # Å

model:
  units: &units 128            # features of the atoms and of the bonds
  max_n: &max_n 4              # radial functions of the bonds, and per degree of the angles
  max_l: &max_l 4              # degrees of the basis of the angles
  num_blocks: &num_blocks 3
  max_z: &max_z 94             # last atomic number of the embedding, from 0
  cosine_margin: 1.0e-7        # the cosines of the angles are kept this far from ±1
  cutoff_power: 3              # power of the smooth cutoff of the bonds of an angle

upstream:
  model_name: m3gnet
  # arguments of the model the rewrite is written for, as stored with the weights
  model_args:
    num_blocks: *num_blocks
    units: *units
    max_l: *max_l
    max_n: *max_n
    cutoff: *radius
    max_z: *max_z
    threebody_cutoff: *three_body_radius
